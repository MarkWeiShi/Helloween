# Fly Proxy supplies Fly-Client-IP. Never forward a caller-supplied X-Real-IP.
map $http_fly_client_ip $ghost_client_ip {
    default $http_fly_client_ip;
    "" $remote_addr;
}
server {
    listen 8080;
    server_name _;
    root /data/web/current;
    include /etc/nginx/ghost-security.conf;
    add_header Cache-Control $ghost_cache_control always;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    location = /api { return 404; }
    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        add_header Cache-Control "no-store" always;
    }
    client_max_body_size 700000;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $ghost_client_ip;
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/i/[\w-]+$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $ghost_client_ip;
        proxy_set_header Cookie "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { return 404; }
    location ~ ^/(?:my-links|rankings)/?$ { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
    index index.html;
}
