server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/ghost-security.conf;
    add_header Cache-Control $ghost_cache_control always;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~ ^/(?:i/[\w-]+|my-links|rankings)/?$ { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
    index index.html;
}
