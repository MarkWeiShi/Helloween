add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy 'camera=(), microphone=(self), geolocation=()' always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://t1.kakaocdn.net https://res.wx.qq.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.kakao.com; frame-src 'self' https://*.kakao.com; media-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
